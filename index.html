
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OPEL LIFE RACING</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0; overflow:hidden; background:#080b10;
  font-family:Arial,sans-serif; color:white;
  touch-action:none; user-select:none;
}
#game {
  display:block; width:100vw; height:100dvh;
  touch-action:none;
}
.hud {
  position:fixed; top:15px; left:15px; right:15px;
  display:flex; justify-content:space-between;
  pointer-events:none; z-index:2;
}
.panel {
  background:#101923dd; border:1px solid #536575;
  border-radius:12px; padding:10px 14px;
  box-shadow:0 4px 18px #0008;
}
.speed {font-size:27px;font-weight:900;color:#55e6ff}
.small {font-size:11px;color:#aebdca;margin-top:3px}
#pause {
  position:fixed; top:100px; right:16px; z-index:5;
  border:1px solid #607586; background:#152331;
  color:white; border-radius:10px; padding:12px 16px;
}
#sound {
  position:fixed; top:100px; left:16px; z-index:5;
  border:1px solid #607586; background:#152331;
  color:white; border-radius:10px; padding:12px 16px;
}
#overlay {
  position:fixed; inset:0; z-index:10;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(#050910bb,#050910ee);
  padding:20px;
}
.box {
  width:min(420px,100%); text-align:center;
  padding:30px 22px; border-radius:22px;
  border:1px solid #455d70;
  background:linear-gradient(145deg,#172432,#080d14);
  box-shadow:0 15px 60px #000b;
}
h1 {font-size:34px;margin:0 0 8px;color:#63eaff}
.subtitle {color:#b5c3ce;line-height:1.5;font-size:14px}
button.start {
  margin-top:22px; padding:15px 35px;
  border:0; border-radius:12px;
  background:linear-gradient(90deg,#00a9cf,#36e1ed);
  color:#04121a; font-size:17px;font-weight:900;
}
.hint {font-size:12px;color:#8295a5;margin-top:17px}
.hidden {display:none!important}
#touchHint {
  position:fixed; bottom:20px; left:0; right:0;
  text-align:center; color:#ffffff80;
  font-size:12px; pointer-events:none;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="panel">
    <div class="speed"><span id="speed">0</span> км/ч</div>
    <div class="small">СКОРОСТЬ</div>
  </div>
  <div class="panel" style="text-align:right">
    <div style="font-size:21px;font-weight:bold" id="score">0</div>
    <div class="small">ОЧКИ</div>
    <div class="small">РЕКОРД: <span id="record">0</span></div>
  </div>
</div>

<button id="sound">♫ ЗВУК: ВЫКЛ</button>
<button id="pause">Ⅱ ПАУЗА</button>
<div id="touchHint">КАСАЙСЯ ЛЕВОЙ ИЛИ ПРАВОЙ ЧАСТИ ЭКРАНА ДЛЯ ПОВОРОТА</div>

<div id="overlay">
  <div class="box">
    <h1>OPEL LIFE RACING</h1>
    <div class="subtitle" id="message">
      Твоя дорога начинается здесь.<br>
      Opel Astra H GTC · А666АА66<br><br>
      Управление пальцем — влево и вправо.
    </div>
    <button class="start" id="start">НАЧАТЬ ЗАЕЗД</button>
    <div class="hint">Уходи от машин и набирай очки!</div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H, roadW, roadX;
let running=false, paused=false, gameOver=false;
let playerX=0, targetX=0;
let speed=30, score=0, distance=0;
let traffic=[], spawnTimer=0, lastTime=0;
let steering=0;
let soundOn=false, audio=null, musicTimer=null;

let record=Number(localStorage.getItem("opelRecord")||0);
document.getElementById("record").textContent=record;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  roadW=Math.min(W*.82,520);
  roadX=(W-roadW)/2;
  if(!playerX) playerX=W/2;
}
addEventListener("resize",resize);
resize();

function roundRect(x,y,w,h,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}

function drawRoad(dt){
  ctx.fillStyle="#18251d";
  ctx.fillRect(0,0,W,H);

  // Обочины
  ctx.fillStyle="#26352a";
  ctx.fillRect(roadX-25,0,roadW+50,H);

  // Асфальт
  ctx.fillStyle="#343a40";
  ctx.fillRect(roadX,0,roadW,H);

  // Краевые линии
  ctx.fillStyle="#e8e8dc";
  ctx.fillRect(roadX+8,0,4,H);
  ctx.fillRect(roadX+roadW-12,0,4,H);

  // Разметка
  const dashH=48, gap=40;
  const offset=(distance*1.4)%(dashH+gap);
  ctx.fillStyle="#e9e9df";
  for(let i=1;i<3;i++){
    let x=roadX+roadW*i/3;
    for(let y=-dashH+offset;y<H;y+=dashH+gap){
      ctx.fillRect(x-2,y,4,dashH);
    }
  }

  // Деревья и фонари
  for(let side of [-1,1]){
    for(let y=-30+(distance*.65)%100;y<H;y+=100){
      let x=side<0?roadX-48:roadX+roadW+20;
      ctx.fillStyle="#426744";
      ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#5b4933";
      ctx.fillRect(x-3,y+8,6,15);
    }
  }
}

function drawCar(x,y,scale,color,isPlayer=false){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);

  // Тень
  ctx.fillStyle="#0009";
  ctx.beginPath();
  ctx.ellipse(0,4,27,49,0,0,Math.PI*2);
  ctx.fill();

  // Колёса
  roundRect(-29,-34,9,23,3,"#090b0d");
  roundRect(20,-34,9,23,3,"#090b0d");
  roundRect(-29,15,9,23,3,"#090b0d");
  roundRect(20,15,9,23,3,"#090b0d");

  // Кузов
  roundRect(-24,-47,48,94,12,color);

  // Стёкла
  roundRect(-19,-34,38,24,7,"#172b3a");
  roundRect(-19,5,38,22,6,"#172b3a");

  // Крыша
  roundRect(-17,-7,34,12,3,"#263d4c");

  // Фары и задние фонари
  roundRect(-20,-44,10,5,2,"#eafcff");
  roundRect(10,-44,10,5,2,"#eafcff");
  roundRect(-20,38,9,5,2,"#ff2929");
  roundRect(11,38,9,5,2,"#ff2929");

  // Номер
  if(isPlayer){
    roundRect(-19,29,38,9,2,"#f5f5ed");
    ctx.fillStyle="#111";
    ctx.font="bold 6px Arial";
    ctx.textAlign="center";
    ctx.fillText("А666АА66",0,35);
    ctx.fillStyle="#fff";
    ctx.font="bold 7px Arial";
    ctx.fillText("ASTRA GTC",0,-14);
  }

  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawRoad();
  traffic.forEach(car=>drawCar(car.x,car.y,car.scale,car.color));
  drawCar(playerX,H-120,1,"#b9c2c9",true);
}

function spawnTraffic(){
  const lanes=[
    roadX+roadW/6,
    roadX+roadW/2,
    roadX+roadW*5/6
  ];
  let lane=lanes[Math.floor(Math.random()*3)];
  traffic.push({
    x:lane,y:-100,
    scale:.85+Math.random()*.12,
    color:["#d72f35","#e6e6e6","#222c39","#d4a63c","#2866a1"][Math.floor(Math.random()*5)],
    speed:Math.random()*.35+.65
  });
}

function update(dt){
  if(!running||paused)return;

  // Плавный разгон
  speed=Math.min(220,speed+dt*.9);
  distance+=speed*dt*.035;
  score+=Math.floor(speed*dt*.02);

  // Плавное управление
  playerX+=(targetX-playerX)*Math.min(1,dt*9);
  playerX=Math.max(roadX+35,Math.min(roadX+roadW-35,playerX));

  spawnTimer+=dt;
  const interval=Math.max(.48,1.45-speed/260);
  if(spawnTimer>interval){
    spawnTraffic();
    spawnTimer=0;
  }

  traffic.forEach(car=>{
    car.y+=(3+speed*.035)*car.speed*dt*.06*60;
  });

  traffic=traffic.filter(car=>car.y<H+100);

  // Проверка столкновения
  for(const car of traffic){
    if(Math.abs(car.x-playerX)<37 &&
       Math.abs(car.y-(H-120))<65){
      endGame();
      return;
    }
  }

  document.getElementById("speed").textContent=Math.round(speed);
  document.getElementById("score").textContent=score;
}

function loop(time){
  let dt=Math.min((time-lastTime)/1000||0,.04);
  lastTime=time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGame(){
  traffic=[];
  score=0;
  speed=30;
  distance=0;
  spawnTimer=0;
  targetX=W/2;
  playerX=W/2;
  gameOver=false;
  paused=false;
  running=true;
  lastTime=performance.now();
  document.getElementById("overlay").classList.add("hidden");
  document.getElementById("pause").textContent="Ⅱ ПАУЗА";
  if(soundOn) startMusic();
}

function endGame(){
  running=false;
  gameOver=true;
  if(score>record){
    record=score;
    localStorage.setItem("opelRecord",record);
    document.getElementById("record").textContent=record;
  }
  document.getElementById("message").innerHTML=
    "ЗАЕЗД ОКОНЧЕН<br><br>Твой результат: "+score+
    "<br>Максимальная скорость: "+Math.round(speed)+" км/ч";
  document.getElementById("start").textContent="ЕЩЁ ОДИН ЗАЕЗД";
  document.getElementById("overlay").classList.remove("hidden");
  stopMusic();
}

document.getElementById("start").addEventListener("click",()=>{
  document.getElementById("start").textContent="НАЧАТЬ ЗАЕЗД";
  startGame();
});

document.getElementById("pause").addEventListener("click",()=>{
  if(!running)return;
  paused=!paused;
  document.getElementById("pause").textContent=
    paused?"▶ ПРОДОЛЖИТЬ":"Ⅱ ПАУЗА";
});

// Сенсорное управление: левая и правая половины экрана
function steerAt(x){
  if(!running||paused)return;
  steering=x<W/2?-1:1;
  const step=roadW/3;
  targetX=Math.max(roadX+35,Math.min(roadX+roadW-35,
    playerX+steering*step));
}

canvas.addEventListener("pointerdown",e=>{
  steerAt(e.clientX);
});
canvas.addEventListener("pointermove",e=>{
  if(e.buttons||e.pointerType==="touch") steerAt(e.clientX);
});
canvas.addEventListener("pointerup",()=>{
  steering=0;
});
canvas.addEventListener("pointercancel",()=>{
  steering=0;
});
canvas.addEventListener("contextmenu",e=>e.preventDefault());

// Простая оригинальная фоновая мелодия
function startMusic(){
  if(!audio){
    audio=new (window.AudioContext||window.webkitAudioContext)();
  }
  audio.resume();
  stopMusic();
  const notes=[220,261.63,329.63,293.66,246.94,293.66,349.23,329.63];
  let i=0;
  musicTimer=setInterval(()=>{
    if(!soundOn||!running||paused)return;
    const osc=audio.createOscillator();
    const gain=audio.createGain();
    osc.type="sine";
    osc.frequency.value=notes[i++%notes.length];
    gain.gain.setValueAtTime(.0001,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.08);
    gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.55);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime+.6);
  },500);
}

function stopMusic(){
  if(musicTimer){
    clearInterval(musicTimer);
    musicTimer=null;
  }
}

document.getElementById("sound").addEventListener("click",()=>{
  soundOn=!soundOn;
  document.getElementById("sound").textContent=
    soundOn?"♫ ЗВУК: ВКЛ":"♫ ЗВУК: ВЫКЛ";
  if(soundOn&&running&&!paused)startMusic();
  else stopMusic();
});
</script>
</body>
</html>

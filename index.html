
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OPEL LIFE RACING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d13;color:white;font-family:Arial;overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.panel{background:#101923ed;border:1px solid #536575;border-radius:12px;padding:10px 13px}
.speed{font-size:25px;color:#55e6ff;font-weight:900}
.small{font-size:11px;color:#b5c2cc;margin-top:3px}
.controls{position:fixed;top:91px;left:12px;right:12px;display:flex;justify-content:space-between}
.controls button,.steering button{background:#152331;color:white;border:1px solid #607586;border-radius:12px;font-weight:bold}
.controls button{padding:11px 14px}
.steering{position:fixed;bottom:25px;left:0;right:0;display:flex;justify-content:space-between;padding:0 25px;pointer-events:none}
.steering button{pointer-events:auto;width:76px;height:65px;font-size:30px;background:#14283add;border:2px solid #58cce5}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#050910d9;padding:20px}
.box{width:min(420px,100%);padding:30px 22px;text-align:center;border:1px solid #455d70;border-radius:22px;background:linear-gradient(145deg,#172432,#080d14)}
h1{color:#63eaff;font-size:31px}
.subtitle{color:#c0ccd4;line-height:1.6;font-size:14px}
.start{background:linear-gradient(90deg,#00a9cf,#36e1ed);border:0;border-radius:12px;padding:15px 30px;font-weight:bold;font-size:17px;margin-top:20px}
.hidden{display:none!important}
#hint{position:fixed;bottom:103px;left:0;right:0;text-align:center;color:#ffffff99;font-size:11px;pointer-events:none}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
 <div class="panel">
  <div class="speed"><span id="speed">30</span> км/ч</div>
  <div class="small">СКОРОСТЬ</div>
 </div>
 <div class="panel" style="text-align:right">
  <b id="score">0</b>
  <div class="small">ОЧКИ</div>
  <div class="small">РЕКОРД: <span id="record">0</span></div>
 </div>
</div>

<div class="controls">
 <button id="sound">♫ ЗВУК: ВЫКЛ</button>
 <button id="pause">Ⅱ ПАУЗА</button>
</div>

<div class="steering">
 <button id="left">←</button>
 <button id="right">→</button>
</div>

<div id="hint">УПРАВЛЕНИЕ СТРЕЛКАМИ</div>

<div id="overlay">
 <div class="box">
  <h1>OPEL LIFE RACING</h1>
  <div class="subtitle" id="message">
   Opel Astra H GTC<br>
   Серебристая · А666АА66<br><br>
   Камера строго сверху.
  </div>
  <button class="start" id="start">НАЧАТЬ ЗАЕЗД</button>
  <p class="small">Уходи от машин и набирай очки!</p>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,DPR;
let running=false,paused=false;
let speed=30,score=0;
let record=Number(localStorage.getItem("opelRecord")||0);
let roadPhase=0;
let playerX=0,targetX=0;
let traffic=[],spawnTimer=0,lastTime=0;
let soundOn=false,audio=null,musicTimer=null;

document.getElementById("record").textContent=record;

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(!playerX){playerX=W/2;targetX=W/2}
}
addEventListener("resize",resize);
resize();

function roadWidth(){return W*.82}
function roadLeft(){return (W-roadWidth())/2}
function laneWidth(){return roadWidth()/3}
function laneX(lane){return roadLeft()+laneWidth()*(lane+.5)}

function rr(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
 ctx.fill();
}

function drawRoad(dt){
 // Фон
 ctx.fillStyle="#263c2c";
 ctx.fillRect(0,0,W,H);

 // Обочины
 ctx.fillStyle="#a39d85";
 ctx.fillRect(roadLeft()-9,0,roadWidth()+18,H);

 // Асфальт
 ctx.fillStyle="#343a40";
 ctx.fillRect(roadLeft(),0,roadWidth(),H);

 // Края дороги
 ctx.fillStyle="#eee9d8";
 ctx.fillRect(roadLeft()+3,0,4,H);
 ctx.fillRect(roadLeft()+roadWidth()-7,0,4,H);

 // Разметка
 ctx.fillStyle="#f4f0df";
 for(let lane=1;lane<=2;lane++){
  for(let i=0;i<12;i++){
   let y=((i*95+roadPhase*H*1.6)%(H+70))-35;
   ctx.fillRect(roadLeft()+laneWidth()*lane-2,y,4,48);
  }
 }

 // Деревья вдоль дороги
 for(let side of [-1,1]){
  for(let i=0;i<10;i++){
   let y=((i*125+roadPhase*H*1.2)%(H+100))-50;
   let x=side===-1?roadLeft()-30:roadLeft()+roadWidth()+30;
   ctx.fillStyle="#315b37";
   ctx.beginPath();
   ctx.arc(x,y,13,0,Math.PI*2);
   ctx.fill();
   ctx.fillStyle="#5b422b";
   ctx.fillRect(x-3,y+8,6,15);
  }
 }
}

// Машина, вид строго сверху
function drawCar(x,y,w,color,isPlayer=false){
 const h=w*1.75;
 ctx.save();
 ctx.translate(x,y);

 // Тень
 ctx.fillStyle="#0009";
 ctx.beginPath();
 ctx.ellipse(0,h*.52,w*.59,h*.49,0,0,Math.PI*2);
 ctx.fill();

 // Колёса
 rr(-w*.53,h*.20,w*.17,h*.25,4,"#090b0d");
 rr(w*.36,h*.20,w*.17,h*.25,4,"#090b0d");
 rr(-w*.53,h*.68,w*.17,h*.25,4,"#090b0d");
 rr(w*.36,h*.68,w*.17,h*.25,4,"#090b0d");

 // Кузов
 let grad=ctx.createLinearGradient(-w/2,0,w/2,0);
 grad.addColorStop(0,"#58636c");
 grad.addColorStop(.22,color);
 grad.addColorStop(.5,"#eef1f2");
 grad.addColorStop(.78,color);
 grad.addColorStop(1,"#56616a");

 ctx.fillStyle=grad;
 ctx.beginPath();
 ctx.moveTo(-w*.29,h*.04);
 ctx.quadraticCurveTo(-w*.42,h*.08,-w*.43,h*.25);
 ctx.lineTo(-w*.48,h*.73);
 ctx.quadraticCurveTo(-w*.46,h*.96,-w*.30,h*.99);
 ctx.lineTo(w*.30,h*.99);
 ctx.quadraticCurveTo(w*.46,h*.96,w*.48,h*.73);
 ctx.lineTo(w*.43,h*.25);
 ctx.quadraticCurveTo(w*.42,h*.08,w*.29,h*.04);
 ctx.closePath();
 ctx.fill();

 // Переднее стекло
 ctx.fillStyle="#172b39";
 ctx.beginPath();
 ctx.moveTo(-w*.31,h*.13);
 ctx.lineTo(w*.31,h*.13);
 ctx.lineTo(w*.34,h*.35);
 ctx.lineTo(-w*.34,h*.35);
 ctx.closePath();
 ctx.fill();

 // Крыша
 rr(-w*.34,h*.38,w*.68,h*.30,5,"#8b969d");
 rr(-w*.29,h*.40,w*.58,h*.25,4,"#243b49");

 // Заднее стекло
 ctx.fillStyle="#172b39";
 ctx.beginPath();
 ctx.moveTo(-w*.34,h*.71);
 ctx.lineTo(w*.34,h*.71);
 ctx.lineTo(w*.30,h*.87);
 ctx.lineTo(-w*.30,h*.87);
 ctx.closePath();
 ctx.fill();

 // Фары спереди
 rr(-w*.36,h*.055,w*.20,h*.045,3,"#fff3c6");
 rr(w*.16,h*.055,w*.20,h*.045,3,"#fff3c6");

 // Задние фонари
 rr(-w*.40,h*.91,w*.18,h*.055,3,"#fa2837");
 rr(w*.22,h*.91,w*.18,h*.055,3,"#fa2837");

 // Эмблема Opel
 ctx.strokeStyle="#e8edf0";
 ctx.lineWidth=Math.max(1,w*.025);
 ctx.beginPath();
 ctx.arc(0,h*.52,w*.065,0,Math.PI*2);
 ctx.stroke();
 ctx.beginPath();
 ctx.moveTo(-w*.10,h*.52);
 ctx.lineTo(w*.10,h*.52);
 ctx.stroke();

 // Номер на машине игрока
 if(isPlayer){
  rr(-w*.25,h*.85,w*.5,h*.075,2,"#f5f3e9");
  ctx.fillStyle="#111";
  ctx.font=`bold ${Math.max(6,w*.075)}px Arial`;
  ctx.textAlign="center";
  ctx.fillText("А666АА66",0,h*.905);
 }

 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 drawRoad();

 // Другие машины
 for(const car of traffic){
  let y=car.y;
  let w=Math.min(laneWidth()*.57,65);
  drawCar(laneX(car.lane),y,w,car.color,false);
 }

 // Opel игрока
 const playerW=Math.min(W*.23,85);
 const playerY=H*.76;
 drawCar(playerX,playerY,playerW,"#b9c2c9",true);
}

function spawnTraffic(){
 let lane=Math.floor(Math.random()*3);
 traffic.push({
  lane,
  y:-120,
  color:["#c52f36","#e4e6e8","#202b38","#c39a43","#28639a"][Math.floor(Math.random()*5)]
 });
}

function update(dt){
 if(!running||paused)return;

 speed=Math.min(220,speed+dt*2.4);
 roadPhase=(roadPhase+dt*(.13+speed*.0018))%1;

 playerX+=(targetX-playerX)*Math.min(1,dt*7);

 const playerW=Math.min(W*.23,85);
 const halfRoad=roadWidth()/2;
 playerX=Math.max(roadLeft()+playerW*.58,
 Math.min(roadLeft()+roadWidth()-playerW*.58,playerX));

 spawnTimer+=dt;
 if(spawnTimer>Math.max(.55,1.65-speed/230)){
  spawnTraffic();
  spawnTimer=0;
 }

 const playerY=H*.76;
 const carH=playerW*1.75;

 traffic.forEach(car=>{
  car.y+=dt*(180+speed*1.8);
 });
 traffic=traffic.filter(car=>car.y<H+150);

 // Проверка столкновения
 for(const car of traffic){
  let otherW=Math.min(laneWidth()*.57,65);
  let otherH=otherW*1.75;
  let dx=Math.abs(laneX(car.lane)-playerX);
  let dy=Math.abs(car.y-playerY);

  if(dx<(playerW+otherW)*.38 &&
     dy<(carH+otherH)*.40){
   endGame();
   return;
  }
 }

 score+=Math.floor(speed*dt*.04);

 document.getElementById("speed").textContent=Math.round(speed);
 document.getElementById("score").textContent=score;
}

function loop(time){
 let dt=Math.min((time-lastTime)/1000||0,.04);
 lastTime=time;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function startGame(){
 traffic=[];
 score=0;
 speed=30;
 roadPhase=0;
 spawnTimer=0;
 playerX=W/2;
 targetX=W/2;
 running=true;
 paused=false;
 lastTime=performance.now();

 document.getElementById("overlay").classList.add("hidden");
 document.getElementById("pause").textContent="Ⅱ ПАУЗА";

 if(soundOn)startMusic();
}

function endGame(){
 running=false;

 if(score>record){
  record=score;
  localStorage.setItem("opelRecord",record);
  document.getElementById("record").textContent=record;
 }

 document.getElementById("message").innerHTML=
 "ЗАЕЗД ОКОНЧЕН<br><br>Очки: "+score+
 "<br>Скорость: "+Math.round(speed)+" км/ч";

 document.getElementById("start").textContent="ЕЩЁ ОДИН ЗАЕЗД";
 document.getElementById("overlay").classList.remove("hidden");
 stopMusic();
}

document.getElementById("start").onclick=()=>{
 document.getElementById("start").textContent="НАЧАТЬ ЗАЕЗД";
 startGame();
};

document.getElementById("pause").onclick=()=>{
 if(!running)return;
 paused=!paused;
 document.getElementById("pause").textContent=
 paused?"▶ ПРОДОЛЖИТЬ":"Ⅱ ПАУЗА";
};

// Управление стрелками
function moveLeft(){
 if(!running||paused)return;
 targetX-=laneWidth()*.75;
 targetX=Math.max(roadLeft()+45,targetX);
}
function moveRight(){
 if(!running||paused)return;
 targetX+=laneWidth()*.75;
 targetX=Math.min(roadLeft()+roadWidth()-45,targetX);
}

document.getElementById("left").addEventListener("pointerdown",e=>{
 e.preventDefault();
 moveLeft();
});
document.getElementById("right").addEventListener("pointerdown",e=>{
 e.preventDefault();
 moveRight();
});

// Клавиатура
addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")moveLeft();
 if(e.key==="ArrowRight"||e.key==="d")moveRight();
});

// Оригинальная мелодия
function startMusic(){
 if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
 audio.resume();
 stopMusic();

 const notes=[220,261.63,329.63,293.66,246.94,293.66,349.23,329.63];
 let i=0;

 musicTimer=setInterval(()=>{
  if(!soundOn||!running||paused)return;

  let osc=audio.createOscillator();
  let gain=audio.createGain();

  osc.type="sine";
  osc.frequency.value=notes[i++%notes.length];
  gain.gain.setValueAtTime(.0001,audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.08);
  gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.55);

  osc.connect(gain);
  gain.connect(audio.destination);
  osc.start();
  osc.stop(audio.currentTime+.6);
 },500);
}

function stopMusic(){
 if(musicTimer){
  clearInterval(musicTimer);
  musicTimer=null;
 }
}

document.getElementById("sound").onclick=()=>{
 soundOn=!soundOn;
 document.getElementById("sound").textContent=
 soundOn?"♫ ЗВУК: ВКЛ":"♫ ЗВУК: ВЫКЛ";

 if(soundOn&&running&&!paused)startMusic();
 else stopMusic();
};
</script>
</body>
</html>
